# /etc/asset-hub/config.yaml 默认形态（install.sh 会拷贝并可用环境变量覆盖路径）
library_root: /home/resourse
library_mount_required: true
data_root: /var/lib/asset-hub
local_only: true
workers: 3
pack_workers: 4       # 同时执行的打包任务数；额外任务进入独立WAL队列
provider: mock          # mock | http
http:
  base_url: ""          # yongboWorkflow 服务根地址，例如 https://api.example.com
  token: ""             # ASSET_SYNC_API_TOKEN 对应的机器密钥
  timeout_sec: 30
sync:
  # finalized 是业务终稿；external 是当前外部素材覆盖层；archive 仍是预留能力。
  kinds: [finalized, external]
  interval_sec: 300
  ticket_batch_size: 50
  # 即使 Manifest 未变化，也每天重新申请 ticket/Stat 一次，发现同 key 覆盖或 OSS 删除。
  verify_interval_sec: 86400
  ignore_globs:
    - "Thumbs.db"
    - "desktop.ini"
    - "._*"
api:
  host: 127.0.0.1
  port: 8080
  workers: 4
  backlog: 2048
  limit_concurrency: 512
