<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云仓资源下载器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=JetBrains+Mono:wght@450;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=8" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-block">
          <div class="brand-title">云仓资源下载器</div>
          <nav class="tabs" role="tablist">
            <button type="button" class="tab active" data-tab="pack" role="tab" aria-selected="true">订单打包</button>
            <button type="button" class="tab" data-tab="library" role="tab" aria-selected="false">资源库</button>
          </nav>
        </div>
        <div class="top-meta">
          <span id="meta-count" class="meta-chip">素材 —</span>
          <span id="meta-ready" class="meta-chip soft">检测中</span>
          <button id="btn-refresh-meta" class="icon-btn" type="button" title="刷新">↻</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section id="view-pack" class="view active" role="tabpanel">
        <div class="pack-layout">
          <aside class="pack-primary">
            <div class="hero-card">
              <div class="hero-kicker">主流程</div>
              <h1>新建打包</h1>
              <p class="hero-desc">上传订单表，自动匹配资源库并生成下载包</p>
              <form id="pack-form" class="pack-form">
                <div class="field">
                  <label for="excel">订单表（.xlsx / .xls）</label>
                  <input id="excel" type="file" accept=".xlsx,.xls" required />
                </div>
                <div class="field">
                  <label for="super">打包文件夹名称 <span class="opt">可选</span></label>
                  <input id="super" type="text" placeholder="不填则自动生成" autocomplete="off" />
                </div>
                <label class="check-row">
                  <input id="auto-download" type="checkbox" checked />
                  完成后自动下载
                </label>
                <button id="pack-submit" class="btn btn-primary btn-lg" type="submit">
                  <span class="btn-label">开始处理</span>
                </button>
                <p id="pack-msg" class="form-msg" hidden></p>
              </form>
            </div>
          </aside>

          <div class="pack-secondary">
            <div class="card" id="progress-card">
              <div class="card-head">
                <div>
                  <h2>当前任务</h2>
                  <p id="progress-label" class="sub">暂无进行中的任务</p>
                </div>
                <div id="progress-pct" class="pct">—</div>
              </div>
              <div class="card-body">
                <div class="bar"><i id="progress-fill"></i></div>
                <div class="steps">
                  <span data-s="queued">排队</span>
                  <span data-s="running">处理</span>
                  <span data-s="done">完成</span>
                </div>
                <dl class="kv">
                  <div><dt>订单表</dt><dd id="meta-filename">—</dd></div>
                  <div><dt>开始</dt><dd id="meta-started">—</dd></div>
                  <div><dt>完成</dt><dd id="meta-finished">—</dd></div>
                </dl>
                <div id="progress-actions" class="row-actions" hidden>
                  <a id="progress-download" class="btn btn-success" href="#">下载结果</a>
                  <button id="btn-job-detail" class="btn btn-ghost" type="button">详情</button>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-head compact">
                <h2>最近结果</h2>
                <button id="btn-open-jobs" class="btn btn-ghost btn-sm" type="button">全部记录</button>
              </div>
              <div id="jobs-preview" class="job-preview">
                <div class="empty">暂无记录</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-library" class="view" role="tabpanel" hidden>
        <div class="lib-toolbar">
          <div class="search-box live">
            <input id="q" type="search" placeholder="实时搜索货号、名称或文件名…" autocomplete="off" />
            <span id="search-spin" class="search-spin" hidden aria-hidden="true"></span>
          </div>
          <div class="lib-meta">
            <span id="lib-total">—</span>
            <span class="dot">·</span>
            <span>瀑布流预览</span>
          </div>
        </div>

        <div id="lib-loading" class="loading-block" hidden>
          <div class="orbit-loader sm"><span></span><span></span><span></span></div>
          <span>正在加载…</span>
        </div>

        <div id="results" class="waterfall"></div>

        <div id="pager" class="pager" hidden>
          <button id="page-prev" class="btn btn-ghost btn-sm" type="button">上一页</button>
          <span id="page-info" class="page-info">1 / 1</span>
          <button id="page-next" class="btn btn-ghost btn-sm" type="button">下一页</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Pack status overlay -->
  <div id="pack-overlay" class="pack-overlay" hidden>
    <div class="pack-overlay-card" role="status" aria-live="polite">
      <div id="pack-anim-busy" class="pack-anim">
        <div class="orbit-loader"><span></span><span></span><span></span><span></span></div>
        <div class="ring-pulse"></div>
      </div>
      <div id="pack-anim-done" class="pack-anim done" hidden>
        <svg class="check-svg" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="check-circle" cx="26" cy="26" r="24" fill="none" />
          <path class="check-mark" fill="none" d="M14 27 l8 8 16-16" />
        </svg>
      </div>
      <h3 id="pack-overlay-title">正在打包</h3>
      <p id="pack-overlay-sub" class="sub">匹配资源并生成压缩包…</p>
      <div class="overlay-bar"><i id="overlay-fill"></i></div>
      <div id="pack-overlay-actions" class="row-actions center" hidden>
        <a id="overlay-download" class="btn btn-success" href="#">下载结果</a>
        <button id="overlay-close" class="btn btn-ghost" type="button">完成</button>
      </div>
    </div>
  </div>

  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="jobs-drawer" class="drawer" hidden aria-hidden="true">
    <div class="drawer-head">
      <div>
        <h2>打包记录</h2>
        <p class="sub">查看进度与下载结果</p>
      </div>
      <button type="button" class="icon-btn" data-close="drawer">✕</button>
    </div>
    <div id="jobs-list" class="drawer-body">
      <div class="empty">暂无记录</div>
    </div>
  </aside>

  <div id="job-modal" class="backdrop modal-wrap" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h2>任务详情</h2>
          <p id="job-modal-sub" class="sub">—</p>
        </div>
        <button type="button" class="icon-btn" data-close="job-modal">✕</button>
      </div>
      <div id="job-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="preview-modal" class="backdrop preview-wrap" hidden>
    <div class="preview-modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h2 id="preview-title">预览</h2>
          <p id="preview-sub" class="sub">—</p>
        </div>
        <div class="row-actions">
          <button id="preview-prev" class="btn btn-ghost btn-sm" type="button">上一张</button>
          <button id="preview-next" class="btn btn-ghost btn-sm" type="button">下一张</button>
          <a id="preview-download" class="btn btn-ghost btn-sm" href="#" download>下载</a>
          <button type="button" class="icon-btn" data-close="preview-modal">✕</button>
        </div>
      </div>
      <div class="preview-stage" id="preview-stage">
        <div id="preview-loading" class="loading-block on-dark">
          <div class="orbit-loader sm light"><span></span><span></span><span></span></div>
          <span>加载预览…</span>
        </div>
        <img id="preview-img" alt="预览" hidden />
      </div>
      <p class="preview-tip">左右键翻页 · 点击图片放大</p>
    </div>
  </div>

  <script src="/app.js?v=8"></script>
</body>
</html>
