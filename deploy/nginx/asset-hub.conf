# asset-hub — nginx 反代 + X-Accel 零拷贝下载
# install.sh 会把 __ASSET_HUB_DATA__ 替换为实际数据根

upstream asset_hub_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;

    # 前端静态（构建产物；未构建时 API 仍可访问）
    root __ASSET_HUB_ROOT__/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://asset_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://asset_hub_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 应用鉴权后返回 X-Accel-Redirect: /internal-files/...
    # 此处禁止外网直接访问，仅内部重定向
    location /internal-files/ {
        internal;
        alias __ASSET_HUB_DATA__/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        directio 16m;
        output_buffers 2 1m;
    }
}
